<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PortfolioHub AI</title>
    <meta name="description" content="A curated directory and live creation platform for modern developer portfolios with zero build setup, clean typography, and instant static ZIP export." />
    <meta property="og:title" content="PortfolioHub AI" />
    <meta property="og:description" content="A curated directory and live creation platform for modern developer portfolios with zero build setup, clean typography, and instant static ZIP export." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#F5F8FC" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Set the saved / system theme before the first paint so there is no light-to-dark flash -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('portfoliohub_theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#121212' : '#F5F8FC');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Caveat:wght@600&family=Onest:wght@400..700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-paper text-ink antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
