    <!-- Set the saved / system theme before the first paint so there is no light-to-dark flash -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('portfoliohub_theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#121212' : '#F5F8FC');
      })();
    </script>
